<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ostatni cykl</title>
<style>
:root{--tlo:#07090c;--pom:#f29b38;--pom-c:#b8631a;--nieb:#5fc4ff;--tekst:#ece8de;--szary:#9aa3ad;
 --szeryf:Georgia,"Noto Serif",serif;--prosty:Roboto,"Noto Sans",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--tekst);font-family:var(--szeryf);user-select:none}
#tel{position:relative;width:min(100vw,430px,45vh);width:min(100vw,430px,45dvh);aspect-ratio:9/20;margin:0 auto;background:var(--tlo);overflow:hidden;container-type:size}
.warstwa{position:absolute;inset:0;background-size:cover;background-position:top center;transition:opacity .4s}
.ukryta{opacity:0}
/* pasek */
.pasek{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:1cqw;padding:2cqw 1.5cqw;
 background:linear-gradient(rgba(0,0,0,.9),rgba(0,0,0,.6));font-family:var(--prosty)}
.post{flex:1;display:flex;align-items:center;gap:5px;min-width:0;position:relative}
.awatar{width:8.6cqw;height:8.6cqw;flex:none;border-radius:50%;border:2px solid var(--pom);background-color:#1a1f26;background-repeat:no-repeat}
.liczby{display:grid;grid-template-columns:auto auto;column-gap:1.5cqw;font-size:3.2cqw;line-height:1.25}
.liczby span{white-space:nowrap;color:var(--szary)} .liczby b{color:var(--tekst);font-weight:600}
.delta{position:absolute;left:2cqw;top:30px;font-size:3.3cqw;font-weight:700;white-space:nowrap;text-shadow:0 1px 3px #000;
 animation:unies 1.6s ease-out forwards;pointer-events:none}
.delta.plus{color:#7be0b0}.delta.minus{color:#ff7b6b}
@keyframes unies{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* portret */
.portret{position:absolute;left:50%;bottom:46%;height:46%;transform:translateX(-50%);max-width:none;opacity:0;transition:opacity .3s;
 filter:drop-shadow(0 0 20px rgba(0,0,0,.85));pointer-events:none}
.portret.widac{opacity:1}
/* panel */
.panel{position:absolute;left:0;right:0;top:54%;bottom:0;z-index:4;padding:2cqw 3cqw;overflow-y:auto;background:rgba(5,7,10,.94);border-top:1px solid #6b4a24}
#tel.wspolny .panel{top:66%;bottom:2%;background:none;border-top:none;overflow:hidden;display:flex;flex-direction:column}
.dymek{display:none!important}
.panel{display:flex;flex-direction:column}
.opcje:empty{display:none}
.panel.zop .log{flex:0 0 auto}
#tel.wspolny .panel.zop{top:auto!important;bottom:0;background:linear-gradient(rgba(5,7,10,0),rgba(5,7,10,.92) 4cqw)}
.log{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1.6cqw;position:relative}
.wpis{background:rgba(10,13,18,.9);border-left:1.2cqw solid var(--pom);border-radius:2cqw;padding:1.8cqw 3cqw;
 font-size:4.8cqw;line-height:1.35;opacity:.55;transition:opacity .3s,max-height .35s,margin .35s,padding .35s;animation:wej .3s ease}
.wpis.ostatni{opacity:1}
.wpis.ostatni::after{content:"▾";float:right;margin:.6cqw 0 0 2cqw;color:var(--pom);font-style:normal;animation:mig 1.2s infinite}
.panel.zop .wpis::after{content:none}
.wpis b{font-size:4.4cqw;margin-right:1.5cqw}
.wpis.Jack{border-left-color:var(--pom)} .wpis.Jack b{color:var(--pom)}
.wpis.Nerd{border-left-color:var(--nieb)} .wpis.Nerd b{color:var(--nieb)}
.wpis[class*="Jack"] b{color:var(--pom)}
.wpis.Soren{border-left-color:#7fe0b8} .wpis.Soren b{color:#7fe0b8}
.dymek.Nerd{border-left-color:var(--nieb)} .dymek.Nerd .kto{color:var(--nieb)}
.dymek.Soren{border-left-color:#7fe0b8} .dymek.Soren .kto{color:#7fe0b8}
.wpis.narr{border-left-color:#6d7480;font-style:italic;color:#cfc9bb}
.wpis.znika{opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-top:-1.6cqw;overflow:hidden}
.log .dalej{position:absolute;right:2cqw;bottom:0}
.dymek{position:relative;background:rgba(10,13,18,.93);border:1px solid #6b4a24;border-left:4px solid var(--pom);
 border-radius:2.5cqw;padding:2.6cqw 3.5cqw 3.8cqw;min-height:17cqw}
.dymek.wejscie{animation:wej .25s ease}
@keyframes wej{from{opacity:0}to{opacity:1}}
.kto{font-weight:bold;color:var(--pom);font-size:4.6cqw;margin-bottom:.6cqw}
.tekst{font-size:5cqw;line-height:1.42}
.tekst.narracja{font-style:italic;color:#cfc9bb}
.dalej{position:absolute;right:12px;bottom:2px;color:var(--pom);animation:mig 1.2s infinite}
@keyframes mig{50%{opacity:.25}}
.opcje{margin-top:2cqw}
.opcja{display:block;width:100%;text-align:left;margin:0 0 1.8cqw;padding:2.4cqw 3.4cqw;border-radius:2.5cqw;
 border:1px solid var(--pom-c);background:rgba(60,34,10,.92);color:var(--tekst);font:inherit;font-size:4.6cqw;line-height:1.3;cursor:pointer}
.opcja b{color:var(--pom);font-family:var(--prosty);margin-right:6px}
.opcja.zablok{opacity:.55;cursor:default;border-style:dashed}
.opcja small{display:block;font-family:var(--prosty);font-size:3cqw;color:var(--szary);margin-top:1cqw}
.opcja:active{background:rgba(110,60,15,.95)}
/* plansza */
.plansza{position:absolute;inset:0;z-index:6;background-size:100% 100%;display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;padding:20% 10% 18%}
.plansza .nad{font-family:var(--prosty);letter-spacing:6px;font-size:12px;color:var(--pom);margin-bottom:22px}
.plansza p{font-size:5.4cqw;line-height:1.5;margin:0 0 16px}
.plansza .duzy{font-size:8.5cqw;margin-bottom:22px}
.osoba{display:flex;gap:3cqw;align-items:flex-start;text-align:left;margin-bottom:3cqw}
.osoba p{font-size:4.7cqw;line-height:1.4;margin:0}
.osoba b{color:var(--pom)}
.awa{width:11cqw;height:11cqw;flex:none;border-radius:50%;border:2px solid var(--pom);background-repeat:no-repeat;background-color:#1a1f26}
.plansza .dotknij{font-family:var(--prosty);font-size:12px;color:var(--szary);margin-top:18px;animation:mig 2s infinite}
.koniec{position:absolute;inset:0;z-index:7;background:rgba(5,7,10,.92);display:flex;flex-direction:column;justify-content:center;
 padding:30px 26px;font-family:var(--prosty);font-size:15px;line-height:1.5}
.koniec h2{font-family:var(--szeryf);font-weight:normal;color:var(--pom);margin:0 0 12px}
.koniec button{margin-top:18px;padding:12px;border-radius:10px;border:1px solid var(--pom-c);background:rgba(60,34,10,.92);color:var(--tekst);font:inherit}

.aktaBtn{flex:none;align-self:center;font-family:var(--prosty);font-size:3cqw;font-weight:700;letter-spacing:.06em;color:var(--pom);border:1px solid var(--pom-c);border-radius:2cqw;padding:1.2cqw 2cqw;background:rgba(40,24,8,.85);position:relative;cursor:pointer}
.aktaBtn .nr{display:inline-block;min-width:4cqw;margin-left:1cqw;color:var(--tekst)}
.aktaBtn.blysk{animation:blysk 1.4s ease-out}
@keyframes blysk{0%{box-shadow:0 0 0 0 rgba(242,155,56,.9)}100%{box-shadow:0 0 0 4cqw rgba(242,155,56,0)}}
.aktaPlus{position:absolute;right:0;top:110%;white-space:nowrap;font-size:3cqw;color:#7be0b0;animation:unies 1.8s ease-out forwards;pointer-events:none}
.akta{position:absolute;inset:0;z-index:12;background:rgba(5,7,10,.97);padding:6cqw 5cqw;overflow-y:auto;font-family:var(--szeryf)}
.akta h2{font-weight:normal;color:var(--pom);margin:0 0 1cqw;font-size:6cqw}
.akta .pod{font-family:var(--prosty);font-size:3.2cqw;color:var(--szary);margin-bottom:4cqw}
.akta h3{font-family:var(--prosty);font-size:3.2cqw;letter-spacing:.15em;color:var(--szary);margin:5cqw 0 2cqw;font-weight:600}
.akta .wpisA{border-left:1cqw solid var(--pom-c);background:rgba(20,24,30,.9);border-radius:1.5cqw;padding:2.4cqw 3cqw;margin-bottom:2cqw;font-size:4.2cqw;line-height:1.4}
.akta .pusto{color:var(--szary);font-style:italic;font-size:4cqw}
.akta .zamknij{position:absolute;right:4cqw;top:4cqw;font-family:var(--prosty);font-size:6cqw;color:var(--szary);background:none;border:none;cursor:pointer}

/* menu startowe */
.start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 9cqw 16cqh;
 background:linear-gradient(rgba(5,7,10,.35),rgba(5,7,10,.55) 40%,rgba(5,7,10,.97) 75%),url(img/centrum.webp) center top/cover no-repeat}
.start h1{font-family:var(--szeryf);font-weight:normal;font-size:12cqw;letter-spacing:.04em;color:var(--tekst);margin:0;text-align:center;text-shadow:0 2px 12px #000}
.start .podt{font-family:var(--prosty);font-size:3.2cqw;letter-spacing:.3em;color:var(--pom);margin:2cqw 0 9cqw;text-align:center}
.start button,.menuW button{display:block;width:100%;margin:0 0 2.6cqw;padding:3.2cqw;border-radius:2.5cqw;border:1px solid var(--pom-c);background:rgba(40,24,8,.88);
 color:var(--tekst);font-family:var(--prosty);font-size:4.4cqw;letter-spacing:.06em;cursor:pointer}
.start button.glowny{background:rgba(110,60,15,.95);border-color:var(--pom)}
.start button:active,.menuW button:active{background:rgba(110,60,15,.95)}
.start .podpis{position:absolute;bottom:4cqw;left:0;right:0;text-align:center;font-family:var(--prosty);font-size:2.8cqw;color:var(--szary)}
.toast{position:absolute;left:8cqw;right:8cqw;bottom:6cqh;z-index:13;background:rgba(20,24,30,.97);border:1px solid var(--pom-c);border-radius:2.5cqw;padding:3cqw;
 font-family:var(--prosty);font-size:3.6cqw;line-height:1.4;text-align:center;animation:wej .3s ease}
.menuBtn{flex:none;align-self:center;font-size:5.4cqw;line-height:1;color:var(--pom);padding:1cqw 1.2cqw;margin-left:-.5cqw;cursor:pointer}
.menuW{position:absolute;inset:0;z-index:11;background:rgba(5,7,10,.93);display:flex;flex-direction:column;justify-content:center;padding:0 12cqw}
.menuW h2{font-family:var(--szeryf);font-weight:normal;color:var(--pom);text-align:center;margin:0 0 6cqw;font-size:7cqw}
.menuW p{font-family:var(--prosty);font-size:4cqw;line-height:1.45;text-align:center;margin:0 0 6cqw}
.akta ul{margin:0 0 3cqw;padding-left:5cqw}.akta li{font-size:4.2cqw;line-height:1.45;margin-bottom:2cqw}
.akta p{font-size:4.2cqw;line-height:1.45;margin:0 0 3cqw}
.zakBox{border:1px dashed #6d7480;border-radius:3cqw;padding:4cqw 4.5cqw;margin:6cqw 0 2cqw;font-family:var(--prosty)}
.zakBox h3{margin:0 0 3cqw!important;font-size:4.4cqw!important;letter-spacing:0!important;color:var(--szary)}
.zakBox .siatka{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw 4cqw;font-size:4.3cqw;line-height:1.3}
.zakBox .nie{color:#5d6470;letter-spacing:.2em}
.zakEkran{padding:20% 11% 17%}
.zakTytul{font-family:var(--szeryf);font-weight:normal;font-size:9cqw;color:var(--tekst);margin:0 0 5cqw;line-height:1.15}
.zakTekst{font-size:4.5cqw!important;line-height:1.55!important;text-align:left;margin:0!important}
.zakPod{font-family:var(--szeryf);font-weight:normal;font-size:6.2cqw;color:var(--tekst);margin:0 0 4cqw}
.zakLista{text-align:left;margin:0 0 4cqw;padding-left:5cqw;font-family:var(--prosty);font-size:4cqw;line-height:1.45;align-self:stretch}
.zakLista li{margin-bottom:2.2cqw}
.zakWsk{font-family:var(--prosty);font-size:3.6cqw!important;color:var(--szary);line-height:1.4!important;margin:0 0 4cqw!important}
.zakBtn{align-self:stretch;margin-top:2.6cqw;padding:3cqw;border-radius:2.5cqw;border:1px solid var(--pom-c);background:rgba(60,34,10,.92);color:var(--tekst);font-family:var(--prosty);font-size:4.2cqw;cursor:pointer}
.jezyk{position:absolute;top:5cqw;right:6cqw;font-family:var(--prosty);font-size:4cqw;color:var(--szary);letter-spacing:.08em}.jezyk span{cursor:pointer;padding:1cqw 1.5cqw}.jezyk span.akt{color:var(--pom);font-weight:bold}
</style>
</head>
<body>
<div id="tel">
  <div id="tloA" class="warstwa"></div>
  <div id="tloB" class="warstwa ukryta"></div>
  <img id="portret" class="portret" alt="">
  <div class="pasek" id="pasek"></div>
  <div class="panel" id="panel"><div class="dymek" id="dymek"><div class="kto" id="kto"></div><div class="tekst" id="tekst"></div><div class="dalej" id="dalej">▾</div></div><div class="log" id="log"></div><div class="opcje" id="opcje"></div></div>
</div>
<script>
var LANG=(function(){try{var q=(location.search.match(/[?&]lang=(pl|en)/)||[])[1];if(q){localStorage.setItem("ostatni_cykl_lang",q);return q}return localStorage.getItem("ostatni_cykl_lang")||"pl"}catch(e){return "pl"}})();
var EN={"Brakuje: ":"Missing: ","AKTA":"FILES","<div class='nad'>PROLOG</div>": "<div class='nad'>PROLOGUE</div>", "<p class='duzy'>XXV wiek.</p>": "<p class='duzy'>The 25th century.</p>", "<p>Dołączasz do załogi statku badawczego.</p>": "<p>You are joining the crew of a research vessel.</p>", "<p>Awansowałeś szybciej, niż powinieneś. Ktoś wysoko postawiony cię polecił — i załoga o tym wie.</p>": "<p>You were promoted faster than you should have been. Someone high up recommended you — and the crew knows it.</p>", "<div class='nad'>ZAŁOGA</div>": "<div class='nad'>THE CREW</div>", "<div class='osoba'><span class='awa' style=\"background-image:url(img/jack.webp);background-size:300%;background-position:52% 14%\"></span><p><b>Jack</b> — dowódca. Wierzy w procedury, ale potrafi je złamać, by ratować ludzi. Później długo nosi ciężar takich decyzji.</p></div>": "<div class='osoba'><span class='awa' style=\"background-image:url(img/jack.webp);background-size:300%;background-position:52% 14%\"></span><p><b>Jack</b> — the commander. He believes in procedure, but he will break it to save his people. Then he carries the weight of those decisions for a long time.</p></div>", "<div class='osoba'><span class='awa' style=\"background-image:url(img/nerd.webp);background-size:320%;background-position:50% 15%\"></span><p><b>Nerd</b> — naukowiec. Genialny, ambitny i doskonale świadomy swoich możliwości. Nie znosi przezwiska, które przylgnęło do niego jeszcze na studiach.</p></div>": "<div class='osoba'><span class='awa' style=\"background-image:url(img/nerd.webp);background-size:320%;background-position:50% 15%\"></span><p><b>Nerd</b> — the scientist. Brilliant, ambitious and fully aware of what he can do. He hates the nickname that has stuck to him since university.</p></div>", "<div class='osoba'><span class='awa' style=\"background-image:url(img/soren.webp);background-size:300%;background-position:50% 14%\"></span><p><b>Soren</b> — obcy ocalały z wraku. Nie zdradza, skąd pochodzi. Załoga mu nie ufa, ale jego wiedza bywa bezcenna.</p></div>": "<div class='osoba'><span class='awa' style=\"background-image:url(img/soren.webp);background-size:300%;background-position:50% 14%\"></span><p><b>Soren</b> — an alien who survived a wreck. He won't say where he comes from. The crew doesn't trust him, but his knowledge can be priceless.</p></div>", "<p>Załoga prowadzi intensywne badania nad maszyną odkrytą na jednej z odległych planet.</p>": "<p>The crew is deep in research on a machine discovered on a distant planet.</p>", "<p>W tym samym czasie jeden z członków zespołu znajduje się w stanie krytycznym.</p>": "<p>At the same time, one of the team is in critical condition.</p>", "<p>Trafiasz na pokład właśnie teraz — w sam środek kryzysu.</p>": "<p>You come aboard right now — in the middle of the crisis.</p>", "Drzwi się rozsuwają. Na głównym ekranie: parametry życiowe jednego z członków załogi.": "The doors slide open. On the main screen: the vital signs of one of the crew.", "„Powiedz mi jeszcze raz, że nie miałeś innego wyjścia.”": "“Tell me again that you had no other choice.”", "„Nie miałem. Jego parametry życiowe spadały. Każda minuta zmniejszała szanse na przeżycie.”": "“I didn't. His vitals were dropping. Every minute lowered his chances.”", "„A więc uznałeś, że możesz sam zdecydować o uruchomieniu urządzenia, którego działania nadal nie rozumiemy?”": "“So you decided you could switch on a device we still don't understand — on your own?”", "„Uznałem, że mam przed sobą człowieka, który umiera. I że istnieje szansa, żeby go uratować.”": "“I decided there was a man dying in front of me. And that there was a chance to save him.”", "„Nie pytałem o twoje intencje.”": "“I didn't ask about your intentions.”", "„A ja nie zamierzam przepraszać za to, że żyje.”": "“And I'm not going to apologise for the fact that he's alive.”", "Jack odwraca się. Dopiero teraz zauważa cię w wejściu.": "Jack turns around. Only now does he notice you in the doorway.", "„A to kto?”": "“And who's this?”", "„Nowy członek zespołu. Miał dzisiaj dołączyć.”": "“The new team member. He was due to join today.”", "„Oczywiście. Właśnie dzisiaj.”": "“Of course. Today of all days.”", "„Dowódca Jack. Wybacz, że nie organizujemy powitania. Mamy trochę ważniejsze problemy.”": "“Commander Jack. Forgive us for skipping the welcome. We have bigger problems.”", "„Rozumiem. Mogę poczekać, aż sytuacja zostanie opanowana.”": "“I understand. I can wait until the situation is under control.”", "„Nie musisz czekać. Na razie po prostu nie przeszkadzaj.”": "“No need to wait. For now, just stay out of the way.”", "„Wygląda na to, że trafiłem w sam środek kryzysu. Co się stało?”": "“Looks like I walked right into a crisis. What happened?”", "„Jeden z naszych ludzi walczy o życie. Resztę wyjaśnię później.”": "“One of our people is fighting for his life. I'll explain the rest later.”", "„Nie wiedziałem, że moje przybycie będzie aż tak niepożądane.”": "“I didn't realise my arrival would be this unwelcome.”", "„To nie jest kwestia twojego przybycia. Nie mam teraz czasu zajmować się twoimi odczuciami.”": "“It's not about your arrival. I don't have time to deal with your feelings right now.”", "„Zanim wrócimy do wzajemnych pretensji, chciałbym przypomnieć, że pacjent żyje.”": "“Before we go back to blaming each other, may I remind you that the patient is alive.”", "„Dzięki urządzeniu, którego działania nie potrafisz przewidzieć.”": "“Thanks to a device whose behaviour you can't predict.”", "„Potrafię przewidzieć wystarczająco dużo, żeby wiedzieć, że bez niego już by nie żył.”": "“I can predict enough to know that without it he'd be dead.”", "„Nie miałeś prawa podejmować tej decyzji za niego.”": "“You had no right to make that decision for him.”", "„Miałem kilka minut na wybór między ryzykiem a śmiercią. Wybrałem ryzyko.”": "“I had a few minutes to choose between risk and death. I chose risk.”", "Jack zauważa, że nadal stoisz obok.": "Jack notices you're still standing there.", "„Skoro już tu jesteś, może przynajmniej dowiemy się, z kim mamy do czynienia. Masz jakieś doświadczenie w sytuacjach kryzysowych?”": "“Since you're here, maybe we can at least find out who we're dealing with. Any experience in crisis situations?”", "„Jack, może najpierw pozwól mu się rozejrzeć? Dopiero przekroczył próg.”": "“Jack, maybe let him look around first? He's barely through the door.”", "„Nie zatrudniamy ludzi po to, żeby się rozglądali.”": "“We don't hire people to look around.”", "„Mam doświadczenie. Jeśli jest coś, w czym mogę pomóc, proszę powiedzieć.”": "“I have experience. If there's anything I can help with, just say so.”", "„Dobrze. Konkretna odpowiedź. Zobaczymy, czy za słowami pójdą umiejętności.”": "“Good. A straight answer. We'll see if the skills match the words.”", "„Może najpierw ktoś wyjaśni mi, co właściwie się tutaj wydarzyło?”": "“Could someone first explain what actually happened here?”", "„Jeden z członków załogi był bliski śmierci. Nerd uruchomił nieznane urządzenie, żeby go uratować. Teraz próbujemy ustalić, co właściwie zrobił.”": "“One of the crew was close to death. Nerd switched on an unknown device to save him. Now we're trying to work out what exactly he did.”", "„I właśnie dlatego warto najpierw poznać fakty, zanim zacznie się wydawać wyroki.”": "“Which is exactly why it's worth knowing the facts before passing sentence.”", "„Jeśli oczekujecie, że od razu zacznę działać, potrzebuję wiedzieć, w co mnie wciągnięto.”": "“If you expect me to act right away, I need to know what I've been dragged into.”", "„Słusznie. Nie oczekuję ślepego posłuszeństwa. Ale kiedy poznasz sytuację, będę oczekiwał odpowiedzialności za własne decyzje.”": "“Fair enough. I don't expect blind obedience. But once you know the situation, I'll expect you to own your decisions.”", "Wchodzisz do kantyny. Przy jednym ze stolików siedzą Nerd i Soren.": "You walk into the mess hall. Nerd and Soren are sitting at one of the tables.", "„Podobno nasz nowy kolega zaliczył ekspresowy awans. Jeszcze nie zdążył się rozpakować, a już jest w naszym zespole.”": "“Apparently our new colleague got an express promotion. He hasn't even unpacked and he's already on our team.”", "„To dość nietypowe. Ktoś musiał go szczególnie polecić.”": "“That's rather unusual. Someone must have recommended him very highly.”", "„Nie mam pojęcia kto. I szczerze mówiąc, niewiele mnie to obchodzi, dopóki nie zacznie przeszkadzać mi w pracy.”": "“No idea who. And frankly I don't care much, as long as he doesn't get in the way of my work.”", "„A jednak ktoś uznał, że właśnie tutaj będzie potrzebny.”": "“And yet someone decided he'd be needed exactly here.”", "„Oby wiedział coś, czego my nie wiemy. Przydałby się ktoś, kto czasem rozwiązuje problemy, zamiast je mnożyć.”": "“Let's hope he knows something we don't. We could use someone who solves problems now and then instead of multiplying them.”", "Nerd podnosi wzrok i dostrzega cię przy wejściu. Na chwilę zapada cisza.": "Nerd looks up and spots you at the entrance. For a moment, silence.", "„Ach, nasz nowy członek załogi. Właśnie o tobie rozmawialiśmy.”": "“Ah, our new crew member. We were just talking about you.”", "„Właściwie to bardziej o okolicznościach twojego przydziału.”": "“More about the circumstances of your assignment, actually.”", "„Powiedz, komu zawdzięczasz tak szybki awans?”": "“Tell me, who do you owe such a quick promotion to?”", "„To długa historia. Może kiedyś będzie okazja, żeby o tym porozmawiać.”": "“It's a long story. Maybe there'll be a chance to talk about it one day.”", "„Oczywiście. Nie nalegam. Niektóre historie lepiej opowiadać we właściwym czasie.”": "“Of course. I won't insist. Some stories are better told at the right time.”", "„Czyli tajemniczy awans i tajemniczy nowy człowiek. Zaczyna się ciekawie.”": "“So, a mysterious promotion and a mysterious new man. This is getting interesting.”", "„Wolałbym o tym nie rozmawiać. To moja sprawa.”": "“I'd rather not talk about it. It's my business.”", "„Rozumiem. Każdy ma prawo zachować pewne sprawy dla siebie.”": "“I understand. Everyone has the right to keep some things to themselves.”", "„Wreszcie ktoś, kto nie zamierza składać raportu z całego życia przy pierwszym spotkaniu.”": "“Finally, someone who isn't going to file a full life report at the first meeting.”", "„A ty? Skąd właściwie pochodzisz, Soren?”": "“And you? Where are you actually from, Soren?”", "„To interesujące pytanie. Nie przypominam sobie jednak, żebym zdążył się przedstawić.”": "“An interesting question. I don't recall having introduced myself, though.”", "„O, proszę. Ledwie się poznaliście, a już wymieniacie się tajemnicami.”": "“Well, well. You've barely met and you're already trading secrets.”", "„Może następnym razem zaczniemy od łatwiejszych pytań.”": "“Perhaps next time we'll start with easier questions.”", "Wchodzisz do ambulatorium. Jack stoi obok zamkniętej kapsuły.": "You enter the medical bay. Jack is standing next to a sealed pod.", "„Urządzenie uratowało porucznika Alana. Ale kiedy się obudził, nadmiar bodźców niemal doprowadził go do obłędu.”": "“The device saved Lieutenant Alan. But when he woke up, the flood of stimuli nearly drove him mad.”", "„Próbował wydostać się przez śluzę. Zabrakło niewiele.”": "“He tried to get out through the airlock. It was a close call.”", "„Teraz jest w kapsule deprywacji sensorycznej. Ograniczamy mu w ten sposób dopływ bodźców.”": "“Now he's in a sensory deprivation pod. It limits how much reaches him.”", "„To mój człowiek i mój statek. Odpowiadam za jedno i drugie.”": "“He's my man and this is my ship. I answer for both.”", "„Chcę znać twoje zdanie. Co powinniśmy teraz zrobić?”": "“I want your opinion. What should we do now?”", "„Nerd złamał procedury. Musi za to odpowiedzieć, niezależnie od intencji.”": "“Nerd broke procedure. He has to answer for it, whatever his intentions.”", "„Zgadzam się. Dobre intencje nie zwalniają z odpowiedzialności.”": "“I agree. Good intentions don't excuse anyone from responsibility.”", "„Jeśli pozwolimy na takie decyzje, następnym razem możemy nie mieć tyle szczęścia.”": "“If we allow decisions like that, next time we might not be so lucky.”", "„Nerd uratował mu życie. Nie możemy teraz przekreślać tego, co zrobił.”": "“Nerd saved his life. We can't write off what he did now.”", "„Nie przekreślam tego. Wiem, że chciał go ratować.”": "“I'm not writing it off. I know he wanted to save him.”", "„Ale życie to nie wszystko. Musimy jeszcze zadbać o to, co stało się później.”": "“But life isn't everything. We still have to deal with what happened afterwards.”", "„Czy ktoś w ogóle zapytał porucznika Alana, czego teraz chce?”": "“Has anyone actually asked Lieutenant Alan what he wants now?”", "„Nie. Nie było z nim kontaktu, kiedy sytuacja wymknęła się spod kontroli.”": "“No. We couldn't reach him when things got out of hand.”", "„Ale masz rację. Nie możemy bez końca podejmować decyzji za niego.”": "“But you're right. We can't keep making decisions for him forever.”", "„Kiedy będzie to możliwe, jego zdanie musi się liczyć.”": "“When it becomes possible, his opinion has to count.”", "Wchodzisz do laboratorium. Nerd pracuje przy rozświetlonym hologramie.": "You walk into the lab. Nerd is working at a glowing hologram.", "„Pozwól, że zgadnę. Jack już zdążył przedstawić ci swoją wersję wydarzeń.”": "“Let me guess. Jack has already given you his version of events.”", "„Pewnie wyszło na to, że jestem nieodpowiedzialnym naukowcem, który bawi się w Boga.”": "“I suppose I came out of it as an irresponsible scientist playing God.”", "„Porucznik Alan umierał. Miałem kilka minut, może mniej. Maszyna była jedyną szansą, żeby go uratować.”": "“Lieutenant Alan was dying. I had a few minutes, maybe less. The machine was the only chance to save him.”", "„Nie zamierzałem stać obok i patrzeć, jak umiera, tylko dlatego, że nie mieliśmy czasu na zebranie komisji.”": "“I wasn't going to stand by and watch him die just because we had no time to convene a committee.”", "„Jednego nie przewidziałem. Tego, co stało się z jego percepcją po przebudzeniu.”": "“There was one thing I didn't foresee. What happened to his perception after he woke up.”", "„To, co teraz rejestruje, wykracza poza ludzkie możliwości. Przyznaję, że nie potrafię przestać o tym myśleć.”": "“What he registers now goes beyond human limits. I admit I can't stop thinking about it.”", "„Może nie powinienem być tym aż tak zafascynowany.”": "“Maybe I shouldn't be quite so fascinated by it.”", "„Powiedz mi wprost. Uważasz, że zrobiłem źle?”": "“Tell me straight. Do you think I did wrong?”", "„Uratowałeś mu życie. W tamtej chwili to było najważniejsze.”": "“You saved his life. At that moment, that was what mattered most.”", "„Właśnie. Czasem trzeba podjąć decyzję, zanim będzie za późno.”": "“Exactly. Sometimes you have to decide before it's too late.”", "„Miło wiedzieć, że nie wszyscy uważają mnie za szaleńca.”": "“Nice to know not everyone thinks I'm a madman.”", "„Może i miałeś rację, ale nie powinieneś decydować o tym sam.”": "“Maybe you were right, but you shouldn't have decided it alone.”", "„Rozumiem, o co ci chodzi. Ale ktoś musiał podjąć decyzję.”": "“I see what you mean. But someone had to make the call.”", "„Fascynacja zmianami u Alana powinna cię niepokoić. To człowiek, nie obiekt badań.”": "“Your fascination with Alan's changes should worry you. He's a man, not a research subject.”", "„Myślisz, że tego nie wiem? Właśnie dlatego próbuję zrozumieć, co mu się stało.”": "“You think I don't know that? That's exactly why I'm trying to understand what happened to him.”", "„Ale masz rację. Czasem łapię się na tym, że bardziej myślę o odkryciu niż o człowieku, którego ono dotyczy.”": "“But you're right. Sometimes I catch myself thinking more about the discovery than about the man it concerns.”", "Wchodzisz do laboratorium. Nerd i Soren stoją przy konsoli, nad którą unosi się hologram zapisu pracy maszyny.": "You walk into the lab. Nerd and Soren are standing at a console, above which floats a hologram of the machine's operating log.", "„Coś tu nie pasuje. Przeglądam zapis od kilku minut i nadal nie widzę, gdzie pojawił się błąd.”": "“Something doesn't add up. I've been going through the log for minutes and I still can't see where the error is.”", "„Tutaj.”": "“Here.”", "Soren wskazuje fragment hologramu, zanim Nerd zdąży odnaleźć go na ekranie.": "Soren points to a section of the hologram before Nerd can find it on the screen.", "„Chwileczkę… Rzeczywiście. Brakuje kilku sekund z samego uruchomienia.”": "“Wait a second… He's right. A few seconds are missing from the start-up itself.”", "„Skąd wiedziałeś, gdzie patrzeć?”": "“How did you know where to look?”", "„Przypadek. Czasem warto przyjrzeć się temu, czego nie ma.”": "“Chance. Sometimes it's worth looking at what isn't there.”", "„To nie jest odpowiedź.”": "“That's not an answer.”", "„Nie twierdziłem, że nią jest.”": "“I didn't claim it was.”", "„Ty też to zauważyłeś. Ciekawe, co zrobisz z tą informacją.”": "“You noticed it too. I wonder what you'll do with that information.”", "„Zgłoszę to Jackowi. Powinien wiedzieć o nieprawidłowości.”": "“I'll report it to Jack. He should know about the irregularity.”", "„Oczywiście. To rozsądne rozwiązanie.”": "“Of course. A sensible choice.”", "„Nie każdy musi samodzielnie rozstrzygać takie sprawy.”": "“Not everyone has to settle such matters on their own.”", "„Świetnie. Jeszcze tylko tego mi brakowało — raportu, zanim ustalę, co właściwie się stało.”": "“Great. Just what I needed — a report before I've even worked out what happened.”", "„Zapytam wprost: co jeszcze widzisz w tym zapisie, Soren?”": "“I'll ask you directly: what else do you see in this log, Soren?”", "„Zadajesz właściwe pytanie. Nie oznacza to jednak, że mam na nie odpowiedź, której oczekujesz.”": "“You are asking the right question. That does not mean I have the answer you expect.”", "„Właśnie. Też chciałbym ją usłyszeć.”": "“Exactly. I'd like to hear it too.”", "„Na razie nic nie zrobię. Chcę zobaczyć, co wydarzy się dalej.”": "“I won't do anything for now. I want to see what happens next.”", "„Cierpliwość bywa niedocenianą zaletą.”": "“Patience is an underrated virtue.”", "„Zwłaszcza gdy nie wiadomo jeszcze, na co warto zwrócić uwagę.”": "“Especially when it isn't yet clear what deserves attention.”", "„Nie jestem przekonany, czy powinniśmy zostawiać to bez zgłoszenia.”": "“I'm not convinced we should leave this unreported.”", "<div class='nad'>AKT 2</div>": "<div class='nad'>ACT 2</div>", "<p class='duzy'>Konsekwencje</p>": "<p class='duzy'>Consequences</p>", "Wracasz do centrum dowodzenia. Jack i Nerd przeglądają zapis z laboratorium.": "You return to the command centre. Jack and Nerd are going through the lab log.", "„W zapisie aktywacji brakuje kilku sekund. Nie potrafię ich odtworzyć.”": "“A few seconds are missing from the activation log. I can't reconstruct them.”", "„Wiem już o luce. Chcę ustalić, co zrobimy dalej i jak zabezpieczyć dostęp do urządzenia.”": "“I already know about the gap. I want to decide what we do next and how to secure access to the device.”", "„Potrzebuję dostępu do danych. Bez tego nie ustalę, co wydarzyło się podczas uruchomienia maszyny.”": "“I need access to the data. Without it I can't work out what happened when the machine started.”", "„Dostęp będzie kontrolowany. Nie zamierzam zostawiać ci wolnej ręki.”": "“Access will be controlled. I'm not giving you a free hand.”", "„A ty? Jak proponujesz postąpić z dalszymi badaniami?”": "“And you? How do you suggest we handle further research?”", "„Poprę ograniczenie dostępu. Nie możesz prowadzić analiz bez zgody Jacka.”": "“I'll back restricting access. You can't run analyses without Jack's approval.”", "„Dobrze. Przynajmniej mamy jasność, na czym stoimy.”": "“Good. At least we know where we stand.”", "„Czyli zanim cokolwiek ustalę, będę musiał prosić o pozwolenie. Świetnie.”": "“So before I find out anything, I'll have to ask permission. Wonderful.”", "„Pozwól Nerdowi badać zapis, ale niech raportuje ci każdy etap.”": "“Let Nerd study the log, but have him report every stage to you.”", "„Raportować każdy etap? To będzie skutecznie spowalniać pracę.”": "“Report every stage? That'll slow the work down very effectively.”", "„W takim razie nauczysz się pracować z nadzorem.”": "“Then you'll learn to work under supervision.”", "„Mogę sam porozmawiać z Sorenem i sprawdzić, co wie.”": "“I can talk to Soren myself and see what he knows.”", "„Dobrze. Spróbuj dowiedzieć się czegoś konkretnego. Nie prowokuj go bez potrzeby.”": "“Fine. Try to find out something concrete. Don't provoke him without reason.”", "„Powodzenia. Mnie jakoś nie kwapił się niczego wyjaśniać.”": "“Good luck. He wasn't exactly eager to explain anything to me.”", "„Znalazłem lukę w zapisie aktywacji. Brakuje kilku sekund, których nie potrafię odtworzyć.”": "“I found a gap in the activation log. A few seconds are missing and I can't reconstruct them.”", "„Czyli nadal nie wiemy, co wydarzyło się w tym czasie.”": "“So we still don't know what happened during that time.”", "„Właśnie dlatego potrzebuję dostępu do danych. Bez nich możemy tylko zgadywać.”": "“Which is exactly why I need access to the data. Without it, we can only guess.”", "„A ty? Wiem, że rozmawiałeś z Sorenem w laboratorium. Zauważyłeś coś, co powinniśmy wiedzieć?”": "“And you? I know you talked to Soren in the lab. Did you notice anything we should know?”", "„Powiem ci teraz. Soren wskazał lukę, zanim Nerd ją znalazł.”": "“I'll tell you now. Soren pointed out the gap before Nerd found it.”", "„Dlaczego nie powiedziałeś mi o tym wcześniej?”": "“Why didn't you tell me earlier?”", "„No dobrze. Był szybszy. Nie musisz tego rozgłaszać po całym statku.”": "“All right. He was faster. You don't have to announce it to the whole ship.”", "„Na razie wolę milczeć i obserwować, co zrobi Soren.”": "“For now I'd rather keep quiet and watch what Soren does.”", "„To twoja decyzja. Pamiętaj jednak, że niektóre informacje tracą wartość, gdy zbyt długo się je zatrzymuje.”": "“Your decision. But remember that some information loses its value when you hold on to it too long.”", "„Rozsądnie. Ja też nie zamierzam tego rozgłaszać.”": "“Sensible. I'm not going to spread it around either.”", "„Nerd, nie wspominaj na razie Jackowi o zachowaniu Sorena.”": "“Nerd, don't mention Soren's behaviour to Jack for now.”", "Dyskretnie zwracasz się do Nerda, tak by Jack nie usłyszał.": "You speak to Nerd quietly, so Jack won't hear.", "„Jasne. Sam nie miałem ochoty opowiadać Jackowi o Sorenie. Ale jeśli coś się wydarzy, nie będę tego ukrywał.”": "“Sure. I didn't feel like telling Jack about Soren anyway. But if something happens, I won't hide it.”", "„Mam nadzieję, że nie planujecie niczego za moimi plecami.”": "“I hope you're not planning anything behind my back.”", "„Potrzebuję dostępu do danych. Bez tego nie ustalę, co się stało.”": "“I need access to the data. Without it I can't work out what happened.”", "„Wiem, że rozmawiałeś z Sorenem w laboratorium. Jak przebiegła ta rozmowa?”": "“I know you talked to Soren in the lab. How did that conversation go?”", "„Zapytałem, co jeszcze widzi w zapisie. Odpowiedział wymijająco.”": "“I asked what else he sees in the log. He was evasive.”", "„Czyli nie mamy odpowiedzi. Będę miał go na oku.”": "“So we have no answer. I'll keep an eye on him.”", "„To niewiele, ale przynajmniej wiemy, że nie chciał nic wyjaśnić.”": "“It's not much, but at least we know he didn't want to explain anything.”", "„Pozwól Nerdowi kontynuować analizę, ale zachowajmy kopię wszystkich danych.”": "“Let Nerd continue the analysis, but let's keep a copy of all the data.”", "„Kopia będzie zabezpieczona. Dostęp do oryginału pozostaje pod kontrolą.”": "“The copy will be secured. Access to the original stays under control.”", "„To rozsądne. Przynajmniej nie stracimy materiału, jeśli coś pójdzie nie tak.”": "“That's sensible. At least we won't lose the material if something goes wrong.”", "„Wstrzymajmy dostęp do urządzenia, dopóki ktoś niezależny nie sprawdzi zapisu.”": "“Let's suspend access to the device until someone independent checks the log.”", "„To może opóźnić badania, ale nie wykluczam takiego rozwiązania.”": "“That could delay the research, but I don't rule it out.”", "„Niezależny ekspert od czego? Od urządzenia, którego nikt z nas nie rozumie?”": "“An independent expert in what? In a device none of us understands?”", "Wchodzisz do ambulatorium, gdzie otwarta kapsuła stoi pusta.": "You enter the medical bay, where the open pod stands empty.", "„Po otwarciu kapsuły Alan odmówił powrotu. Odłączył czujniki i wyszedł.”": "“When the pod was opened, Alan refused to go back. He disconnected the sensors and walked out.”", "„Poszedł do swojej kwatery i zablokował drzwi od środka.”": "“He went to his quarters and locked the door from the inside.”", "„Nie mamy pewności, w jakim jest stanie. Nie możemy zostawić go bez kontroli.”": "“We can't be sure what state he's in. We can't leave him unmonitored.”", "„Przymus może tylko pogorszyć sytuację. Musimy sprawdzić, jak funkcjonuje poza kapsułą.”": "“Force can only make things worse. We need to see how he functions outside the pod.”", "„Przyznaję, że to, jak radzi sobie z nadmiarem bodźców, jest fascynujące.”": "“I admit the way he copes with the overload of stimuli is fascinating.”", "„To nie jest eksperyment. Mówimy o człowieku, za którego odpowiadam.”": "“This is not an experiment. We're talking about a man I'm responsible for.”", "„Właśnie dlatego nie powinniśmy podejmować pochopnych decyzji.”": "“Which is exactly why we shouldn't make rash decisions.”", "„Musimy zdecydować teraz. Przywracamy zabezpieczenia czy pozwalamy mu zostać poza kapsułą?”": "“We have to decide now. Do we restore the safeguards or let him stay outside the pod?”", "„Przywróć blokadę kapsuły. Dalszą decyzję pozostawiam tobie.”": "“Restore the pod lock. I'll leave the next decision to you.”", "„Zajmę się tym. Nie możemy ryzykować bezpieczeństwa Alana ani załogi.”": "“I'll handle it. We can't risk Alan's safety or the crew's.”", "„Czyli wracamy do zamknięcia go w kapsule. Nie jestem przekonany, że to pomoże.”": "“So we go back to locking him in the pod. I'm not convinced that will help.”", "„Pozwólmy mu zostać poza kapsułą. Obserwujmy go bez przymusu.”": "“Let him stay outside the pod. Let's watch him without force.”", "„Zgadzam się na obserwację, ale nie na brak zabezpieczeń. Musimy znać jego stan.”": "“I agree to observation, but not to having no safeguards. We need to know his condition.”", "„To rozsądniejsze. Przynajmniej nie będziemy pogarszać sytuacji przymusem.”": "“That's more sensible. At least we won't make things worse by forcing him.”", "„Sam zorganizuję dyżury. Alan nie zostanie bez opieki, ale nie zmusimy go do powrotu.”": "“I'll organise the watches myself. Alan won't be left alone, but we won't force him back.”", "„Bierzesz na siebie odpowiedzialność za nadzór. Oczekuję regularnych raportów.”": "“You're taking on responsibility for the supervision. I expect regular reports.”", "„To może zadziałać. Będziemy obserwować jego stan, nie narzucając mu kapsuły.”": "“That might work. We'll monitor his condition without forcing the pod on him.”", "Wchodzisz do laboratorium; Nerd analizuje dane, a Soren stoi obok niego.": "You walk into the lab; Nerd is analysing data, with Soren standing beside him.", "„Te odczyty nie mają sensu. Jeden wskazuje stabilne parametry Alana, drugi sugeruje poważne zaburzenia.”": "“These readings make no sense. One shows Alan's vitals as stable, the other suggests serious disturbances.”", "„Nie mogę ustalić, który jest wiarygodny. Bez tego nie wiemy, jak naprawdę czuje się porucznik.”": "“I can't tell which one is reliable. Without that, we don't know how the lieutenant is really doing.”", "„Czy wszystkie pomiary zostały wykonane w tym samym przedziale czasu?”": "“Were all the measurements taken in the same time window?”", "„Tak. Sprawdziłem znaczniki. Są zgodne.”": "“Yes. I checked the timestamps. They match.”", "„A czy porównujesz wartości z tego samego źródła?”": "“And are you comparing values from the same source?”", "„Chwileczkę... Nie. Część danych pochodzi z kanału pomocniczego.”": "“Wait a moment... No. Some of the data comes from the auxiliary channel.”", "„Co się stanie, jeśli zestawisz je osobno?”": "“What happens if you put them side by side separately?”", "„Wtedy rozbieżności znikają. To nie błędne pomiary, tylko niewłaściwie połączone strumienie danych.”": "“Then the discrepancies disappear. These aren't faulty measurements, just data streams merged the wrong way.”", "„Mam to. Wystarczy rozdzielić kanały i ponownie zsynchronizować odczyty.”": "“Got it. I just need to split the channels and resynchronise the readings.”", "„Tak. Pozostaje jeszcze korekta konfiguracji, żeby błąd nie powrócił.”": "“Yes. There is still the configuration to correct, so the error doesn't come back.”", "„Znam ten moduł, ale nie pamiętam wszystkich ustawień.”": "“I know that module, but I don't remember all the settings.”", "„Mogę wprowadzić poprawkę. Jeśli wolisz, mogę też wyjaśnić ją Nerdowi, zanim cokolwiek zmienimy.”": "“I can apply the fix. If you prefer, I can also explain it to Nerd before we change anything.”", "„Zrób to. Wprowadź poprawkę sam.”": "“Do it. Apply the fix yourself.”", "„Dobrze. Zajmę się tym ostrożnie.”": "“Very well. I will be careful.”", "„Skoro zna ustawienia lepiej ode mnie, nie będę mu przeszkadzał. Chcę zobaczyć wynik.”": "“If he knows the settings better than I do, I won't get in his way. I want to see the result.”", "„Najpierw zabezpieczmy kopię wszystkich danych.”": "“First, let's secure a copy of all the data.”", "„Rozsądne zabezpieczenie. Nie mam powodu, by się sprzeciwiać.”": "“A sensible precaution. I have no reason to object.”", "„Dobrze. Będziemy mieli punkt odniesienia, gdyby coś poszło nie tak.”": "“Good. We'll have a reference point if anything goes wrong.”", "„Nerd zachowa kontrolę. Soren, wyjaśnij mu poprawkę krok po kroku.”": "“Nerd stays in control. Soren, explain the fix to him step by step.”", "„Oczywiście. To Nerd będzie wprowadzał zmiany, więc powinien znać każdy etap.”": "“Of course. Nerd will be making the changes, so he should know every stage.”", "„Właśnie tak wolę. Pokaż mi, od którego ustawienia zacząć.”": "“That's exactly how I like it. Show me which setting to start with.”", "Wchodzisz do maszynowni; Jack sprawdza wskazania systemów przy konsoli.": "You enter the engine room; Jack is checking system readouts at the console.", "„Alan, kapsuła, luka w zapisie. Do tego nowy człowiek w zespole.”": "“Alan, the pod, the gap in the log. And a new man on the team on top of it.”", "„Każda decyzja wraca do mnie. Nie mogę sobie pozwolić na kolejny błąd.”": "“Every decision comes back to me. I can't afford another mistake.”", "„Katastrofa w końcu mija. Decyzje, które dowódca wtedy podjął, zostają z nim na zawsze.”": "“A disaster passes in the end. The decisions a commander made during it stay with him forever.”", "„Nie znamy się na tyle, żebyś mógł oceniać moje decyzje.”": "“We don't know each other well enough for you to judge my decisions.”", "„Nie oceniam ich. Wiem tylko, że odpowiedzialność potrafi zostać z człowiekiem znacznie dłużej niż samo zdarzenie.”": "“I am not judging them. I only know that responsibility can stay with a person much longer than the event itself.”", "„Czasem nie ma nikogo, komu można ją oddać.”": "“Sometimes there's no one to hand it to.”", "„To nie znaczy, że trzeba nieść ją bez chwili wytchnienia.”": "“That does not mean you must carry it without a moment's rest.”", "„Wycofam się. Nie będę wam przeszkadzać.”": "“I'll step back. I won't get in your way.”", "„Dziękuję. Potrzebowałem chwili, żeby uporządkować myśli.”": "“Thank you. I needed a moment to sort out my thoughts.”", "„Czasem obecność oznacza również uszanowanie czyjejś ciszy.”": "“Sometimes being present also means respecting someone's silence.”", "„Nie musisz dźwigać wszystkiego sam. Masz załogę.”": "“You don't have to carry everything alone. You have a crew.”", "„Wiem. Tylko nie zawsze łatwo mi o tym pamiętać.”": "“I know. It's just not always easy to remember.”", "„Dobrze, że ktoś mu o tym przypomniał.”": "“Good that someone reminded him.”", "„Mówisz o tym z własnego doświadczenia?”": "“Are you speaking from experience?”", "„To osobiste pytanie. Nie musisz na nie odpowiadać, Soren.”": "“That's a personal question. You don't have to answer it, Soren.”", "„Niektóre doświadczenia łatwiej rozpoznać, niż o nich opowiadać.”": "“Some experiences are easier to recognise than to talk about.”", "„Jeśli znajdziesz chwilę, zapraszam do mojej kabiny. Chciałbym z tobą porozmawiać.”": "“If you find a moment, please come to my cabin. I would like to talk to you.”", "Jack przerywa sprawdzanie konsoli i patrzy na ciebie znacząco.": "Jack stops checking the console and gives you a meaningful look.", "<p>Kilka godzin później.</p>": "<p>A few hours later.</p>", "Przychodzisz do kabiny Sorena na jego zaproszenie z maszynowni.": "You come to Soren's cabin, at the invitation he gave you in the engine room.", "„Czy przysłał cię dowódca?”": "“Did the commander send you?”", "„Tak. Jack chce wiedzieć, co wiesz.”": "“Yes. Jack wants to know what you know.”", "Soren przyjmuje odpowiedź spokojnym skinieniem głowy.": "Soren takes the answer with a calm nod.", "„Nie. Przyszedłem z własnej woli.”": "“No. I came of my own accord.”", "„Mój statek się rozbił. Z całej załogi przeżyłem tylko ja.”": "“My ship crashed. Of the whole crew, only I survived.”", "„Nie ocalałem dzięki szczególnym umiejętnościom. Po prostu tak się złożyło.”": "“I did not survive because of any special skill. That is simply how it happened.”", "„Flota nie odsyła ocalałych do domu. Zabiera ich razem z technologią, którą przywieźli.”": "“The Fleet does not send survivors home. It takes them, together with the technology they brought.”", "„Znałem kogoś, kto przeżył taką katastrofę. Trafił do jednego z ich ośrodków. Nigdy nie wrócił.”": "“I knew someone who survived such a crash. He was taken to one of their facilities. He never came back.”", "Na ścianie dostrzegasz ciemny proporzec z półksiężycem nad pionową kreską. Ten sam znak widnieje na metalowym krążku obracanym w dłoni Sorena.": "On the wall you notice a dark pennant with a crescent above a vertical line. The same sign is on the metal disc Soren is turning in his hand.", "Soren zauważa twoje spojrzenie. Nie chowa krążka i nie komentuje znaku.": "Soren notices your gaze. He doesn't hide the disc and doesn't comment on the sign.", "„Od tamtej pory wasz statek jest moim domem. Przynajmniej na razie.”": "“Since then, your ship has been my home. For now, at least.”", "„Chciałbym zapytać o porucznika Alana. Czy śpi spokojnie? Czy nadal słyszy więcej niż pozostali?”": "“I would like to ask about Lieutenant Alan. Does he sleep peacefully? Does he still hear more than the others?”", "„Mówi coś o tym, co czuje? O tym, co dociera do niego inaczej niż wcześniej?”": "“Does he say anything about what he feels? About what reaches him differently than before?”", "Zastanawia cię, skąd Soren wie, o co dokładnie pytać.": "You wonder how Soren knows exactly what to ask.", "„Chciałbym zobaczyć porucznika Alana. Jeśli to niemożliwe, wystarczyłyby mi jego odczyty.”": "“I would like to see Lieutenant Alan. If that is impossible, his readings would be enough.”", "„Widziałem już coś podobnego. Być może mógłbym pomóc, zanim skutki okażą się trudniejsze do opanowania.”": "“I have seen something like this before. Perhaps I could help, before the effects become harder to control.”", "„Nie proszę, żebyś mi zaufał. Proszę tylko, żebyś rozważył tę możliwość.”": "“I am not asking you to trust me. I am only asking you to consider the possibility.”", "„Pomogę ci dostać się do Alana albo zdobyć jego odczyty.”": "“I'll help you get to Alan or get his readings.”", "„Doceniam to. Nie będę nadużywał twojej pomocy.”": "“I appreciate it. I will not abuse your help.”", "„Nie. Bez zgody Jacka nikt obcy nie zbliży się do Alana.”": "“No. Without Jack's approval, no outsider goes near Alan.”", "„Rozumiem. Nie oczekiwałem, że będzie to łatwe.”": "“I understand. I did not expect it to be easy.”", "„Mogę pomóc, ale Jack musi o tym wiedzieć.”": "“I can help, but Jack has to know about it.”", "„Rozsądny warunek. Nie zamierzam stawiać cię między mną a dowódcą.”": "“A reasonable condition. I do not intend to put you between me and the commander.”", "<p>Następnego dnia.</p>": "<p>The next day.</p>", "Wchodzisz do laboratorium; Nerd wzywał cię pilnie.": "You walk into the lab; Nerd has urgently called for you.", "„No i co? Rozmawiałeś z nim?”": "“Well? Did you talk to him?”", "„W kabinie ma proporzec z półksiężycem nad kreską. Chce zobaczyć Alana lub jego odczyty.”": "“He has a pennant in his cabin with a crescent above a line. He wants to see Alan or his readings.”", "„Dobrze, że mi powiedziałeś. Nie podejdzie do Alana bez mojej zgody.”": "“Good that you told me. He won't go near Alan without my approval.”", "Jack wychodzi z laboratorium.": "Jack leaves the lab.", "„Nic konkretnego.”": "“Nothing concrete.”", "„To nie brzmi jak cała odpowiedź. Nie będę cię teraz naciskał.”": "“That doesn't sound like the whole answer. I won't press you now.”", "„Udało mi się odzyskać strzęp brakujących sekund z pamięci podręcznej.”": "“I managed to recover a fragment of the missing seconds from the cache.”", "„To nie jest zwykły błąd zapisu. Znalazłem coś, czego nie potrafię jeszcze wyjaśnić.”": "“This isn't an ordinary logging error. I found something I can't explain yet.”", "„I nie wiem, czy bardziej mnie to cieszy, czy niepokoi.”": "“And I don't know whether it excites me or worries me more.”", "„W logu widzę, że Soren przeglądał odczyty Alana, zanim odzyskałem fragment. Skorzystał z dostępu, który mu umożliwiłeś. Wiedziałeś?”": "“I can see in the log that Soren went through Alan's readings before I recovered the fragment. He used the access you gave him. Did you know?”", "Wiedziałeś, że Soren chciał zobaczyć dane, ale nie że już je przeglądał.": "You knew Soren wanted to see the data, but not that he had already looked at it.", "„Spójrz na zapis uruchomienia. W odzyskanym fragmencie jest jeszcze ten symbol.”": "“Look at the start-up log. There's this symbol in the recovered fragment too.”", "Rozpoznajesz półksiężyc nad pionową kreską z proporca i krążka Sorena. Wahasz się, czy powiedzieć Nerdowi, że widziałeś go wcześniej.": "You recognise the crescent above a vertical line from Soren's pennant and disc. You hesitate over whether to tell Nerd you've seen it before.", "„Udało mi się częściowo odczytać opis przy symbolu.”": "“I managed to partly read the description next to the symbol.”", "„Mówi o zachowaniu życia poza jego naturalną granicą.”": "“It talks about preserving life beyond its natural limit.”", "„Nie rozumiem, co to miałoby oznaczać dla Alana.”": "“I don't understand what that would mean for Alan.”", "„Przy symbolu jest jeszcze opis, ale nie odczytałem go do końca.”": "“There's a description next to the symbol too, but I haven't read all of it.”", "„Jeszcze nad nim pracuję.”": "“I'm still working on it.”", "Nie pokazuje ci dalszej części zapisu.": "He doesn't show you the rest of the log.", "Soren wskazał brakujące sekundy, nosił ten sam znak i pytał o Alana. To nie był przypadek.": "Soren pointed out the missing seconds, wore the same sign and asked about Alan. It was no coincidence.", "Soren od początku wiedział, czym jest maszyna.": "Soren knew from the start what the machine is.", "„Idę do Sorena. Chcę usłyszeć, co ma do powiedzenia.”": "“I'm going to Soren. I want to hear what he has to say.”", "„Nie wiem, czy to najlepszy moment. Ale nie będę cię zatrzymywał.”": "“I don't know if this is the best moment. But I won't stop you.”", "„Nie powiem Sorenowi, co znaleźliśmy. Będę go obserwować.”": "“I won't tell Soren what we found. I'll watch him.”", "„Uważaj, żebyś nie pomylił cierpliwości z bezczynnością.”": "“Careful you don't mistake patience for doing nothing.”", "„Zabezpieczmy fragment, zanim Soren dowie się, że go odczytaliśmy.”": "“Let's secure the fragment before Soren finds out we've read it.”", "„Dobrze. Zrobię kopię i zabezpieczę jej dostęp. Nie możemy ryzykować utraty jedynego fragmentu.”": "“Fine. I'll make a copy and lock down access to it. We can't risk losing the only fragment.”", "<div class='nad'>AKT 3</div>": "<div class='nad'>ACT 3</div>", "<p class='duzy'>Cena wiedzy</p>": "<p class='duzy'>The Price of Knowledge</p>", "Idziesz prosto z laboratorium do kabiny Sorena i wchodzisz bez pukania.": "You go straight from the lab to Soren's cabin and walk in without knocking.", "„Spodziewałem się, że przyjdziesz.”": "“I expected you to come.”", "Pytasz wprost, czy wiedział, czym jest ta maszyna.": "You ask him outright whether he knew what this machine is.", "„Tak.”": "“Yes.”", "Przychodzisz do Sorena pod pretekstem powrotu do rozmowy o poruczniku Alanie.": "You come to Soren on the pretext of returning to the conversation about Lieutenant Alan.", "„Nie przyszedłeś tu wyłącznie z powodu Alana.”": "“You did not come here only because of Alan.”", "„Wyczuwam, że coś wiesz. Zastanawiasz się tylko, ile mi powiedzieć.”": "“I sense you know something. You are only wondering how much to tell me.”", "Soren sam wezwał cię do kabiny.": "Soren has summoned you to his cabin himself.", "„Odzyskaliście fragment i zabezpieczyliście go. Wiem o tym.”": "“You recovered a fragment and secured it. I know.”", "„Nie będę udawał, że ta wiadomość mnie ucieszyła.”": "“I will not pretend the news pleased me.”", "„Znałem tę maszynę, zanim wasza załoga ją znalazła.”": "“I knew this machine before your crew found it.”", "„Nie kłamałem. Po prostu nikt mnie nie zapytał.”": "“I did not lie. Nobody asked me.”", "„Maszyna pochodzi od mojego ludu. Służy do odbudowy ciała, nie do zmieniania zmysłów.”": "“The machine comes from my people. It is meant to rebuild the body, not to change the senses.”", "„Nie została stworzona z myślą o ludzkim organizmie. Zmiany u Alana są skutkiem ubocznym jej działania.”": "“It was not built with the human body in mind. The changes in Alan are a side effect of how it works.”", "„Moi ludzie żyją długo dzięki takim urządzeniom. Bez nich nasze ciała z czasem przestają się odbudowywać.”": "“My people live long thanks to such devices. Without them, our bodies eventually stop rebuilding themselves.”", "„Żyję dłużej niż ktokolwiek z mojego ludu. Bez tej maszyny po prostu się zestarzeję. Nie zamierzam rezygnować z kolejnych lat.”": "“I have lived longer than anyone of my people. Without this machine I will simply grow old. I do not intend to give up the years ahead.”", "„To nie jest to, czym się wydaje. Jeszcze nie jesteś gotów usłyszeć reszty.”": "“It is not what it seems. You are not ready to hear the rest yet.”", "„Co zamierzasz z tym zrobić?”": "“What are you going to do about it?”", "„Pomogę ci. Nie obiecuję, że będzie łatwo, ale spróbuję.”": "“I'll help you. I can't promise it'll be easy, but I'll try.”", "„Zapamiętam tę obietnicę. Nie będę wymagał od ciebie więcej, niż sam możesz zdecydować.”": "“I will remember that promise. I will not ask more of you than you can decide yourself.”", "„Jack dowie się tego, co mi powiedziałeś.”": "“Jack will hear what you've told me.”", "„Masz prawo mu powiedzieć. Nie będę próbował cię powstrzymywać.”": "“You have the right to tell him. I will not try to stop you.”", "„Nie podejmę teraz decyzji. Zachowam tę rozmowę dla siebie.”": "“I won't decide now. I'll keep this conversation to myself.”", "„Rozumiem. Czasem milczenie daje więcej możliwości niż pochopna deklaracja.”": "“I understand. Sometimes silence leaves more options than a hasty declaration.”", "<p>Następnego ranka.</p>": "<p>The next morning.</p>", "Rano przychodzisz do laboratorium na pilne wezwanie Nerda.": "In the morning you come to the lab at Nerd's urgent call.", "„Prawie nie spałem. Obejrzyj nagranie z nocnego monitoringu.”": "“I barely slept. Look at last night's monitoring footage.”", "Porucznik Alan sam wchodzi do laboratorium, podchodzi do maszyny i długo przy niej stoi. Niczego nie dotyka.": "Lieutenant Alan walks into the lab alone, goes up to the machine and stands by it for a long time. He touches nothing.", "„Sprawdziłem jego odczyty z ostatnich dni. Zmiany w organizmie Alana się pogłębiają.”": "“I checked his readings from the last few days. The changes in Alan's body are getting deeper.”", "„Bez korekty będzie coraz gorzej.”": "“Without a correction, it will only get worse.”", "„Sprawdziłem też ogniwo maszyny. Jest uszkodzone, a energii zostało na jeden pełny cykl.”": "“I also checked the machine's power cell. It's damaged, and there's enough energy left for one full cycle.”", "„Reaktor M-03 nie może jej zasilić. To inna technologia. Próba podłączenia grozi przeciążeniem reaktora.”": "“The M-03 reactor can't power it. It's a different technology. Trying to connect it risks overloading the reactor.”", "„Jedno mnie zastanawia. Alan sam przychodzi do laboratorium i stoi przy urządzeniu. Co z tym robimy?”": "“One thing puzzles me. Alan comes to the lab on his own and stands by the device. What do we do about it?”", "„Zablokujmy mu dostęp do laboratorium.”": "“Let's lock him out of the lab.”", "„Nie podoba mi się to. Odcinamy go od miejsca, do którego sam wraca, a ja tracę możliwość obserwowania jego zachowania.”": "“I don't like it. We'd be cutting him off from a place he keeps coming back to, and I'd lose the chance to observe his behaviour.”", "„Zostawmy wszystko jak jest. Obserwujmy, co zrobi kolejnej nocy.”": "“Let's leave everything as it is. Let's watch what he does tomorrow night.”", "„Dobrze. Sprawdzę zapis monitoringu po następnej nocy. Przynajmniej nie będziemy go prowokować.”": "“Fine. I'll check the monitoring after the next night. At least we won't provoke him.”", "„Pójdę do jego kwatery. Chcę sprawdzić, czego od nas oczekuje.”": "“I'll go to his quarters. I want to find out what he expects from us.”", "„Sam? Nie wiem, czy cię wpuści. Nie naciskaj, jeśli nie będzie chciał rozmawiać.”": "“Alone? I don't know if he'll let you in. Don't push if he doesn't want to talk.”", "<p>Idziesz do kwatery porucznika Alana.</p>": "<p>You go to Lieutenant Alan's quarters.</p>", "<p>Nie odpowiada na pukanie. Po chwili drzwi się otwierają.</p>": "<p>He doesn't answer the knock. After a moment, the door opens.</p>", "Ten sam znak. Na ścianach, na podłodze, na drzwiach szafki — dziesiątki razy, każdy trochę inny.": "The same sign. On the walls, on the floor, on the locker doors — dozens of times, each one a little different.", "Jakby Alan szukał właściwego i wciąż nie mógł go znaleźć.": "As if Alan were looking for the right one and still couldn't find it.", "Alan stoi za tobą w drzwiach. Patrzy na ciebie, potem odwraca wzrok w stronę laboratorium.": "Alan stands behind you in the doorway. He looks at you, then turns his eyes towards the lab.", "Jack wzywa cię do centrum dowodzenia. Chce porozmawiać bez świadków.": "Jack calls you to the command centre. He wants to talk without witnesses.", "„Doceniam, że powiedziałeś mi o Sorenie, kiedy znaleźliśmy lukę w zapisie.”": "“I appreciate that you told me about Soren when we found the gap in the log.”", "„Wspominałeś o znaku w kabinie Sorena i o jego prośbie dotyczącej Alana.”": "“You mentioned the sign in Soren's cabin and his request about Alan.”", "„Nie zapomniałem o tym.”": "“I haven't forgotten.”", "„Nerd powiedział mi, że byłeś u Alana. Co tam zobaczyłeś?”": "“Nerd told me you went to see Alan. What did you see there?”", "„Mam wrażenie, że wiesz więcej niż ja. Na moim statku.”": "“I have a feeling you know more than I do. On my ship.”", "„Nie lubię, gdy ktoś na moim statku ma tajemnice. Nawet jeśli ma dobre powody.”": "“I don't like it when someone on my ship keeps secrets. Even if they have good reasons.”", "„Sprawdziłem jeszcze raz rozkaz twojego przydziału. Zobacz, kiedy go wystawiono.”": "“I checked your assignment order again. Look at when it was issued.”", "„Przyszedł przed uruchomieniem maszyny. Na dole jest dopisek: «Priorytet: obserwacja urządzenia».”": "“It came in before the machine was switched on. At the bottom there's a note: ‘Priority: observation of the device.’”", "„Nie wiem, kto go dodał. Podpis jest zaczerniony.”": "“I don't know who added it. The signature is blacked out.”", "„Ktoś z góry uznał, że potrzebuję obserwatora. Nie lubię, gdy Flota nadzoruje mój statek bez pytania.”": "“Someone up top decided I needed an observer. I don't like the Fleet watching my ship without asking.”", "„Po dotarciu do bazy maszyna przejdzie pod kontrolę Floty. Możesz być pewien, że nie zostawią jej nam.”": "“Once we reach the base, the machine goes under Fleet control. You can be sure they won't leave it with us.”", "„Twój przydział od początku mi się nie podobał.”": "“I never liked your assignment.”", "„Co jeszcze powinienem wiedzieć?”": "“What else should I know?”", "„Powiem ci wszystko, co wiem o Sorenie i o tym, co zobaczyłem u Alana.”": "“I'll tell you everything I know about Soren and what I saw at Alan's.”", "Mówisz Jackowi, że Soren znał maszynę, zanim ją znaleźliście.": "You tell Jack that Soren knew the machine before you found it.", "„Powiem tylko o stanie maszyny i Alana. Bez informacji o Sorenie.”": "“I'll only tell you about the state of the machine and Alan. Nothing about Soren.”", "Mówisz Jackowi o jednym cyklu w ogniwie i o tym, że zmiany u Alana postępują.": "You tell Jack about the single cycle left in the cell and that Alan's changes are progressing.", "„Jeden cykl i żadnego bezpiecznego sposobu na doładowanie. Musimy dobrze przemyśleć, co z nim zrobimy.”": "“One cycle and no safe way to recharge. We need to think hard about what we do with it.”", "„Na razie to wszystko.”": "“That's all for now.”", "„W porządku. Ale proszę cię o szczerość. Nie chcę dowiadywać się o ważnych sprawach od kogoś innego.”": "“All right. But I'm asking you to be honest. I don't want to learn about important things from someone else.”", "Mówisz, że maszyna pochodzi od jego ludu i służy do odbudowy ciała.": "You tell him the machine comes from Soren's people and is meant to rebuild the body.", "I że Soren żyje dzięki maszynie dłużej niż ktokolwiek z jego ludu. Bez niej po prostu się zestarzeje.": "And that thanks to the machine Soren has lived longer than anyone of his people. Without it, he will simply grow old.", "Przyznajesz, że Soren przeglądał odczyty Alana — z dostępem od ciebie.": "You admit that Soren went through Alan's readings — with access from you.", "Opowiadasz o znakach w kwaterze Alana i o tym, jak spojrzał w stronę laboratorium.": "You tell him about the signs in Alan's quarters and how he looked towards the lab.", "„To zmienia sytuację. Nie możemy już traktować działań Sorena jak zwykłej ciekawości.”": "“That changes things. We can no longer treat Soren's actions as simple curiosity.”", "„Skoro go ostrzegłeś, będzie przygotowany na to, że zacznę zadawać pytania.”": "“Since you warned him, he'll be ready for me to start asking questions.”", "<p>Później tego samego dnia.</p>": "<p>Later that same day.</p>", "Nerd od świtu analizuje dane Alana. Wezwał cię, gdy znalazł coś istotnego.": "Nerd has been analysing Alan's data since dawn. He called you when he found something important.", "„Porównałem obecne odczyty Alana z jego dokumentacją medyczną sprzed wypadku.”": "“I compared Alan's current readings with his medical records from before the accident.”", "„Maszyna próbuje odbudować jego ciało według wzorca, na którym została skalibrowana. To nie jest ludzki wzorzec.”": "“The machine is trying to rebuild his body according to the template it was calibrated on. It isn't a human template.”", "„Gdybyśmy podali jej właściwy, ludzki wzorzec, mogłaby cofnąć zmiany.”": "“If we gave it the right, human template, it could reverse the changes.”", "„Nie wiem jednak, jak przestawić maszynę. Nie rozumiem jej sterowania.”": "“But I don't know how to reconfigure the machine. I don't understand its controls.”", "„Jedyną osobą, która może znać sposób przestawienia, jest Soren.”": "“The only person who might know how to reconfigure it is Soren.”", "„Potrzebujemy jego wiedzy, danych Alana sprzed wypadku, które mam, i ostatniego cyklu energii.”": "“We need his knowledge, Alan's pre-accident data, which I have, and the last cycle of energy.”", "„Muszę to jeszcze zbadać.”": "“I still need to look into it.”", "Zamyka część danych i przechodzi do kolejnego wykresu. Masz wrażenie, że nie powiedział ci wszystkiego.": "He closes part of the data and moves on to the next chart. You have the feeling he hasn't told you everything.", "„Jack już tu był. Zakazał mi zbliżać się do maszyny bez jego zgody. Jakby brakowało mi nadzoru.”": "“Jack was already here. He banned me from going near the machine without his permission. As if I didn't have enough supervision.”", "„Przekazał mi, co mu powiedziałeś o Sorenie.”": "“He passed on what you told him about Soren.”", "„Maszyna przedłuża Sorenowi życie bardziej, niż ktokolwiek z jego ludu mógłby oczekiwać. A on chce jeszcze więcej. Trudno powiedzieć, że go nie rozumiem.”": "“The machine extends Soren's life more than anyone of his people could hope for. And he wants even more. I can't say I don't understand him.”", "„Chcę pomóc Alanowi. Nie po to ratowaliśmy go, żeby teraz patrzeć, jak jego stan się pogarsza.”": "“I want to help Alan. We didn't save him just to watch his condition get worse.”", "„Ale to największe odkrycie w mojej karierze. Jeśli wykorzystamy ostatni cykl, mogę stracić szansę, żeby naprawdę zrozumieć to urządzenie.”": "“But this is the biggest discovery of my career. If we use the last cycle, I could lose the chance to truly understand this device.”", "„Nie chcę wybierać między ratowaniem człowieka a wiedzą, której być może nigdy więcej nie zdobędziemy.”": "“I don't want to choose between saving a man and knowledge we may never get again.”", "„Alan jest najważniejszy. Badania muszą poczekać.”": "“Alan comes first. The research has to wait.”", "„Wiem. Nie musisz mi przypominać, że chodzi o człowieka. Ale trudno mi pogodzić się z utratą takiej szansy.”": "“I know. You don't have to remind me it's about a man. But it's hard to accept losing a chance like this.”", "„Najpierw zrozummy maszynę. Potem zdecydujemy, jak jej użyć.”": "“Let's understand the machine first. Then we'll decide how to use it.”", "„Właśnie tego potrzebuję. Nie chcę zmarnować ostatniego cyklu przez decyzję podjętą w ciemno.”": "“That's exactly what I need. I don't want to waste the last cycle on a decision made in the dark.”", "„Pójdę do Sorena. Poproszę go, żeby pomógł Alanowi.”": "“I'll go to Soren. I'll ask him to help Alan.”", "„To może być nasza jedyna szansa. Soren zna tę technologię lepiej od nas.”": "“That may be our only chance. Soren knows this technology better than we do.”", "Wchodzisz do maszynowni, gdy Jack i Soren rozmawiają o dalszym losie ogniwa.": "You enter the engine room as Jack and Soren are discussing what to do with the power cell.", "„Wyjmę ogniwo z maszyny i zamknę je w zbrojowni.”": "“I'll take the cell out of the machine and lock it in the armoury.”", "„Nikt go nie użyje bez mojego rozkazu. Nie będziemy ryzykować, że ostatni cykl zostanie wykorzystany bez kontroli.”": "“No one uses it without my order. We won't risk the last cycle being used without control.”", "„Wiem, czym jest ta maszyna dla twojego ludu. Wiem, do czego została stworzona.”": "“I know what this machine is to your people. I know what it was built for.”", "„Wiem też, co stracisz, jeśli ją zabierzemy. Będziesz starzał się jak każdy.”": "“I also know what you'll lose if we take it. You'll age like everyone else.”", "„Nie będę temu zaprzeczał.”": "“I will not deny it.”", "„Wyjęcie ogniwa z działającej maszyny może je uszkodzić. Wtedy nie będzie już służyć ani Alanowi, ani nikomu innemu.”": "“Removing the cell from a running machine may damage it. Then it will serve neither Alan nor anyone else.”", "„Nie chciałbym, żeby ostatnia możliwość została przekreślona przez pośpiech.”": "“I would not want the last chance to be thrown away through haste.”", "„Pamiętam twoją prośbę o pomoc Alanowi. Jeszcze na nią nie odpowiedziałem.”": "“I remember your request to help Alan. I have not answered it yet.”", "„Jesteś po mojej stronie czy nie?”": "“Are you on my side or not?”", "„Popieram decyzję Jacka. Ogniwo powinno trafić pod klucz.”": "“I back Jack's decision. The cell should be locked away.”", "„Dobrze. Zajmę się tym. Ogniwo zostanie zabezpieczone w zbrojowni.”": "“Good. I'll take care of it. The cell will be secured in the armoury.”", "„Rozumiem. Mam nadzieję, że wiesz, jak wiele możliwości właśnie zamykasz.”": "“I understand. I hope you know how many possibilities you are closing.”", "„Nie ruszaj ogniwa. Nie możesz sam decydować o tym, co się z nim stanie.”": "“Don't touch the cell. You can't decide alone what happens to it.”", "„To ja odpowiadam za ten statek. Nie możesz oczekiwać, że będę bezczynnie patrzył.”": "“I'm the one responsible for this ship. You can't expect me to just stand by.”", "„Dziękuję. Nie zapomnę, że zdecydowałeś się mnie wysłuchać.”": "“Thank you. I will not forget that you chose to hear me out.”", "„Nie podejmujmy tej decyzji przed naradą całej załogi.”": "“Let's not make this decision before a meeting of the whole crew.”", "„Nie podoba mi się to. Ale dobrze. Zwołam naradę, zanim podejmiemy ostateczną decyzję.”": "“I don't like it. But fine. I'll call a meeting before we make a final decision.”", "„To daje nam przynajmniej szansę na rozważenie wszystkich konsekwencji.”": "“That at least gives us a chance to weigh all the consequences.”", "„Nie mam czasu na narady.”": "“I don't have time for meetings.”", "„Wyjmę ogniwo. Decyzja pozostaje w moich rękach.”": "“I'm taking the cell out. The decision stays in my hands.”", "„W takim razie mam nadzieję, że nie popełnisz błędu, którego nie będzie można naprawić.”": "“Then I hope you will not make a mistake that cannot be undone.”", "<p>Noc.</p>": "<p>Night.</p>", "<p>Rano.</p>": "<p>Morning.</p>", "Nerd wzywa cię do ambulatorium. W nocy wydarzyło się coś, czego się nie spodziewał.": "Nerd calls you to the medical bay. Something happened in the night that he didn't expect.", "„Alan przyszedł tu w nocy sam. Położył się w kapsule. Nikt go do tego nie zmuszał.”": "“Alan came here alone during the night. He lay down in the pod. Nobody forced him.”", "„Nie wiem, czy powinienem się cieszyć. Bardziej mnie to niepokoi.”": "“I don't know whether I should be glad. It worries me more.”", "„Odczyty pogorszyły się bardziej, niż przewidywałem. Mamy mniej czasu, niż myśleliśmy.”": "“His readings got worse than I predicted. We have less time than we thought.”", "Podchodzisz do kapsuły. Alan otwiera oczy, dostrzega cię i przykłada dłoń do szyby. Na dłoni widzisz znak z maszyny.": "You walk up to the pod. Alan opens his eyes, sees you and presses his hand to the glass. On his palm you see the sign from the machine.", "„Narada całej załogi w centrum dowodzenia. Teraz. Wszyscy mają się stawić.”": "“Whole-crew meeting in the command centre. Now. Everyone report.”", "Jack (interkom)": "Jack (intercom)", "„Wszyscy do centrum dowodzenia. Podjąłem decyzję i chcę ją ogłosić.”": "“Everyone to the command centre. I've made a decision and I want to announce it.”", "„Wszyscy do centrum dowodzenia. Natychmiast.”": "“Everyone to the command centre. Immediately.”", "„Jack i Soren nie zamienili ze sobą słowa od rana.”": "“Jack and Soren haven't said a word to each other since morning.”", "Opuszczasz ambulatorium i kierujesz się do centrum dowodzenia.": "You leave the medical bay and head for the command centre.", "<div class='nad'>AKT 4</div>": "<div class='nad'>ACT 4</div>", "<p class='duzy'>Narada</p>": "<p class='duzy'>The Meeting</p>", "Wszyscy są już w centrum dowodzenia. Jack, Nerd i Soren stoją przy stole. Nikt nie siada.": "Everyone is already in the command centre. Jack, Nerd and Soren are standing at the table. Nobody sits down.", "Odsunięty": "Sidelined", "„Zwołałem naradę, bo ktoś mnie o to poprosił. Niech każdy powie, czego chce.”": "“I called this meeting because someone asked me to. Let everyone say what they want.”", "„Ogniwo jest w zbrojowni. Chcę je zniszczyć, a Alana utrzymać w kapsule, dopóki nie dotrzemy do bazy.”": "“The cell is in the armoury. I want to destroy it and keep Alan in the pod until we reach the base.”", "„Ogniwo wciąż jest w maszynie, bo ktoś stanął mi na drodze.”": "“The cell is still in the machine, because someone stood in my way.”", "Jack patrzy na ciebie dłużej, niż to konieczne.": "Jack looks at you longer than necessary.", "„Nie zamierzam ryzykować statku dla czyjegokolwiek eksperymentu.”": "“I'm not going to risk the ship for anyone's experiment.”", "„Ogniwo trzeba zniszczyć. Nie będę ryzykował statku. Alana nie da się już uratować.”": "“The cell has to be destroyed. I won't risk the ship. Alan can't be saved any more.”", "„Zmiany u Alana da się odwrócić. Nerd ma jego dane, a Soren zna maszynę.”": "“Alan's changes can be reversed. Nerd has his data, and Soren knows the machine.”", "„To jeszcze nie znaczy, że próba się powiedzie.”": "“That still doesn't mean the attempt will work.”", "„Nie możemy niszczyć ogniwa, dopóki nie sprawdzimy wszystkich możliwości.”": "“We can't destroy the cell until we've checked every option.”", "„Nie będę czekał bez końca na odpowiedź, której może nie być.”": "“I won't wait forever for an answer that may not exist.”", "<i>Niczego nie mówisz.</i>": "<i>You say nothing.</i>", "„Tak myślałem.”": "“I thought so.”", "„Ale nie zniszczę ogniwa, dopóki nie sprawdzimy tej możliwości.”": "“But I won't destroy the cell until we've checked that option.”", "„Nie podejmę ryzyka na podstawie samej informacji. Potrzebuję pewności.”": "“I won't take a risk on information alone. I need certainty.”", "„Ostatni cykl to jedyna szansa, żeby zrozumieć tę maszynę. Nie wolno go zmarnować.”": "“The last cycle is the only chance to understand this machine. We mustn't waste it.”", "„Alan jest najważniejszy. Wiem. Ale bez Sorena nie przestawię maszyny.”": "“Alan comes first. I know. But without Soren I can't reconfigure the machine.”", "„Jedyna droga dla Alana prowadzi przez Sorena. Nie podoba mi się to, ale tak jest.”": "“The only way for Alan goes through Soren. I don't like it, but that's how it is.”", "„Alan zostawił znak. Chce sam zdecydować. Nie możesz podejmować tej decyzji za niego.”": "“Alan left a sign. He wants to decide for himself. You can't make this decision for him.”", "„Widziałem te znaki. Wiem, co próbujesz powiedzieć.”": "“I've seen those signs. I know what you're trying to say.”", "„Alan nie jest materiałem badawczym. Musimy pamiętać, że to człowiek.”": "“Alan isn't research material. We have to remember he's a human being.”", "„Właśnie dlatego nie możemy działać bez zrozumienia, co robimy.”": "“Which is exactly why we can't act without understanding what we're doing.”", "„W porządku. Przynajmniej ktoś musi myśleć o konsekwencjach.”": "“All right. At least someone has to think about the consequences.”", "„Masz rację. Nie powinienem decydować za niego.”": "“You're right. I shouldn't decide for him.”", "„To nie zmienia faktu, że wciąż nie rozumiemy działania maszyny.”": "“That doesn't change the fact that we still don't understand how the machine works.”", "„Mogę przestawić maszynę na Alana. Nie zrobię tego. Ostatni cykl jest mój.”": "“I can reconfigure the machine for Alan. I will not do it. The last cycle is mine.”", "„Ostatni cykl jest mój. Nie oddam go.”": "“The last cycle is mine. I will not give it up.”", "„Mój rozkaz przydziału mówi, że Flota chce maszyny. Wiemy, co robi z ocalałymi. Jack może wypuścić cię wahadłowcem. Pomóż Alanowi, a odzyskasz wolność.”": "“My assignment order says the Fleet wants the machine. We know what they do with survivors. Jack can let you go on a shuttle. Help Alan, and you get your freedom back.”", "„Długie życie w ich ośrodku nie jest tym, czego chcę. Wolność może być lepszą wymianą.”": "“A long life in their facility is not what I want. Freedom may be the better trade.”", "„Wahadłowiec poleci przed nami. Będziesz wolny, ale za twoje zniknięcie odpowiem ja.”": "“The shuttle will leave ahead of us. You'll be free, but I'll answer for your disappearance.”", "„Dane Alana mam. Jeśli Soren przestawi maszynę, przygotuję ludzki wzorzec.”": "“I have Alan's data. If Soren reconfigures the machine, I'll prepare the human template.”", "„Zgoda. Jeśli Alan wybierze powrót do dawnego stanu, pomogę. Potem odlatuję.”": "“Agreed. If Alan chooses to return to what he was, I will help. Then I leave.”", "Układ zostaje zawarty.": "The deal is made.", "„Wiem, jak wiele dała ci ta maszyna. Nie zamierzam udawać, że nie masz czego stracić.”": "“I know how much this machine has given you. I'm not going to pretend you have nothing to lose.”", "„Przynajmniej rozumiesz, o co chodzi.”": "“At least you understand what is at stake.”", "„Nie możesz po prostu zdecydować za wszystkich.”": "“You can't just decide for everyone.”", "„Nie decyduję za wszystkich. Mówię wam, czego nie zrobię.”": "“I am not deciding for everyone. I am telling you what I will not do.”", "„W takim razie nie mamy o czym rozmawiać.”": "“Then we have nothing to talk about.”", "„Dowództwo przysłało cię tu z jednym priorytetem: ta maszyna. Więc to ty zdecydujesz.”": "“Command sent you here with one priority: this machine. So you decide.”", "„Jesteś tu najkrócej. Może dlatego widzisz to najjaśniej. Ty zdecydujesz.”": "“You've been here the shortest. Maybe that's why you see it most clearly. You decide.”", "„Komu oddajemy decyzję?”": "“Who do we give the decision to?”", "„Decyzja należy do dowódcy. Jack, zrób to, co uważasz za słuszne.”": "“The decision belongs to the commander. Jack, do what you think is right.”", "„Dobrze. Biorę to na siebie
